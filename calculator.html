<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <main class="Calculator" aria-label="Calculator">
        <section class="display" aria-label="Calculator display">
            <div class="previous-value" aria-hidden="true">&nbsp;</div>
            <output class="current-value" aria-live="polite">0</output>
        </section>
        

    </main>
</body>
</html>
